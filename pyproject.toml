[project]
name = "chocolate-paan-sales"
version = "0.1.0"
description = "AI-Based Chocolate Paan Sales Prediction System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-CORS>=4.0.0",
    "Werkzeug>=3.0.0",
    "Jinja2>=3.1.2",
    "scikit-learn>=1.4.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",
    "gunicorn>=21.2.0",
]

[tool.vercel]
entrypoint = "backend.app:app"
